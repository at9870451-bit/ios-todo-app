server:
  port: 8080

spring:
  application:
    name: quant-okx-server
  jackson:
    # null 字段也输出（契约里 positions / lastSignal / errorMessage 允许为 null）
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    # 未匹配到处理器时抛异常，交给 GlobalExceptionHandler 走统一信封
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

quantokx:
  # 前端 X-Auth-Token 鉴权令牌。生产环境务必修改！也可用环境变量 QUANT_OKX_AUTH_TOKEN 覆盖。
  auth-token: ${QUANT_OKX_AUTH_TOKEN:changeme}
  version: 1.0.0
  # 配置持久化目录（./data/config.json，权限 600）
  data-dir: ./data
  # OKX 接口基础地址
  base-url: https://www.okx.com
  # @Scheduled 调度心跳（毫秒）。引擎每 1 秒醒来一次，再按当前 pollSeconds 判断是否跑下一轮，
  # 这样 PUT /api/config 修改 pollSeconds 后，下一轮立即生效（热更新）。
  poll-pulse-millis: 1000

logging:
  level:
    root: info
    com.quantokx: info
