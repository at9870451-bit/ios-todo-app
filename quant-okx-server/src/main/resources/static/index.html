<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantOKX 控制台</title>
<style>
:root{color-scheme:light dark;--bg:#0b0e14;--card:#141921;--bd:#222a36;--fg:#e6e9ef;--muted:#8a93a3;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;
  min-height:100vh;padding:14px;max-width:760px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted);font-size:13px}
.row .v{font-weight:500;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.t-green{background:rgba(34,197,94,.15);color:var(--green)}
.t-red{background:rgba(239,68,68,.15);color:var(--red)}
.t-orange{background:rgba(245,158,11,.15);color:var(--orange)}
.t-blue{background:rgba(59,130,246,.15);color:var(--blue)}
button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;
  font-weight:600;cursor:pointer;width:100%}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--fg)}
.btn-red{background:var(--red)}
.btn-row{display:flex;gap:8px}
.btn-row button{width:auto;flex:1}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;background:#0d1117;border:1px solid var(--bd);border-radius:8px;color:var(--fg);
  padding:9px 10px;font-size:14px;font-family:inherit}
input:focus{outline:0;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{padding:8px 12px;border-radius:10px;background:rgba(59,130,246,.1);text-align:center;font-weight:600}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.down{color:var(--red)}
.log{font-family:ui-monospace,monospace;font-size:12px;line-height:1.7}
.log .a{display:inline-block;min-width:54px;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:600;margin-right:6px}
.err{color:var(--orange);font-size:13px;padding:10px;background:rgba(245,158,11,.08);border-radius:8px}
.ok{color:var(--green)}
.hidden{display:none}
.gate{text-align:center;padding:40px 20px}
.gate input{max-width:340px;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--card);border-radius:10px;padding:4px}
.tabs button{flex:1;background:transparent;color:var(--muted);font-weight:500;padding:8px}
.tabs button.on{background:var(--blue);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.warn{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red);
  padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<h1>📊 QuantOKX 控制台</h1>
<div class="sub" id="srv">连接后端中…</div>

<!-- 令牌门 -->
<div id="gate" class="card gate hidden">
  <h2>访问令牌</h2>
  <p class="hint" style="margin-bottom:12px">首次使用请填入后端的访问令牌（保存在本地，不上传）</p>
  <input id="tokIn" type="password" placeholder="X-Auth-Token">
  <label></label>
  <button onclick="saveToken()">进入控制台</button>
</div>

<!-- 警告 -->
<div id="liveWarn" class="warn hidden">⚠️ 实盘模式：所有下单都是真金白银</div>

<!-- 选项卡 -->
<div id="tabs" class="tabs hidden">
  <button class="on" data-t="dash">交易台</button>
  <button data-t="cfg">配置</button>
  <button data-t="log">日志</button><button data-t="vip">会员</button>
</div>

<!-- 交易台 -->
<div id="t-dash" class="tab">
  <div class="card">
    <h2>行情</h2>
    <div class="row"><span class="k">交易对</span><span class="v" id="d-inst">—</span></div>
    <div class="row"><span class="k">最新价</span><span class="v big" id="d-price">—</span></div>
    <div class="row"><span class="k">24h 涨跌</span><span class="v" id="d-chg">—</span></div>
    <div class="row"><span class="k">24h 高/低</span><span class="v" id="d-hl">—</span></div>
  </div>
  <div class="card">
    <h2>引擎状态</h2>
    <div class="row"><span class="k">运行状态</span><span class="v" id="d-run">—</span></div>
    <div class="row"><span class="k">模式</span><span class="v" id="d-mode">—</span></div>
    <div class="row"><span class="k">轮询次数</span><span class="v" id="d-tick">—</span></div>
    <div class="row"><span class="k">可用 USDT</span><span class="v" id="d-bal">—</span></div>
    <div class="row"><span class="k">最新信号</span><span class="v" id="d-sig">—</span></div>
    <div class="row"><span class="k">AI 回复</span><span class="v" id="d-ai">—</span></div>
    <div style="margin-top:12px" class="btn-row">
      <button id="btnStart" onclick="engine('start')">启动</button>
      <button id="btnStop" class="btn-red" onclick="engine('stop')">停止</button>
    </div>
    <div id="d-err" class="err hidden" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <h2>持仓</h2>
    <div id="d-pos"><span class="k">空仓</span></div>
    <div style="margin-top:10px"><button class="btn-red" onclick="closeAll()">一键平仓</button></div>
  </div>
</div>

<!-- 配置 -->
<div id="t-cfg" class="tab hidden">
  <div class="card">
    <h2>OKX API 密钥</h2>
    <label>API Key</label>
    <input id="c-key" placeholder="留空表示不修改">
    <label>API Secret</label>
    <input id="c-secret" type="password" placeholder="留空表示不修改">
    <label>Passphrase</label>
    <input id="c-pass" type="password" placeholder="留空表示不修改">
    <label>当前密钥</label>
    <div id="c-mask" class="hint">未配置</div>
    <label>运行模式</label>
    <select id="c-demo"><option value="1">模拟盘（不花真钱）</option><option value="0">实盘（真实下单）</option></select>
    <div style="margin-top:12px"><button onclick="saveOKX()">保存密钥</button></div>
    <div style="margin-top:8px" class="btn-row">
      <button class="btn-ghost" onclick="testOKX()">测试 OKX 连接</button>
    </div>
    <div id="c-test" class="hint" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <h2>策略与参数</h2>
    <label>策略</label>
    <select id="c-strat"></select>
    <label>交易对</label>
    <select id="c-inst"></select>
    <label>K 线周期</label>
    <select id="c-bar">
      <option value="1m">1分钟</option><option value="5m">5分钟</option><option value="15m">15分钟</option>
      <option value="30m">30分钟</option><option value="1H">1小时</option><option value="4H">4小时</option>
      <option value="1D">日线</option>
    </select>
    <div class="grid2">
      <div><label>每单金额 USDT</label><input id="c-size" type="number" step="0.1"></div>
      <div><label>杠杆</label><input id="c-lev" type="number" min="1" max="20"></div>
      <div><label>轮询间隔 秒</label><input id="c-poll" type="number" min="5"></div>
      <div><label>每小时最多笔</label><input id="c-maxt" type="number"></div>
      <div><label>止损 %</label><input id="c-sl" type="number" step="0.1"></div>
      <div><label>止盈 %</label><input id="c-tp" type="number" step="0.1"></div>
      <div><label>最大持仓 USDT</label><input id="c-maxp" type="number"></div>
      <div><label>启用 AI</label><select id="c-ai"><option value="0">否</option><option value="1">是</option></select></div>
    </div>
    <div style="margin-top:12px"><button onclick="saveParams()">保存参数</button></div>
  </div>
</div>

<!-- 日志 -->
<div id="t-log" class="tab hidden">
  <div class="card">
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn-ghost" onclick="loadLogs()">刷新</button>
      <button class="btn-ghost" onclick="clearLogs()">清空</button>
    </div>
    <div id="log-list" class="log"></div>
  </div>
</div>

<!-- 会员 -->
<div id="t-vip" class="tab hidden">
  <div class="card"><h2>当前状态</h2><div id="v-status" class="hint">加载中…</div></div>
  <div class="card"><h2>订阅时长</h2>
    <select id="v-months" style="max-width:240px">
      <option value="1">1 个月</option>
      <option value="3">3 个月</option>
      <option value="12">12 个月（8 折）</option>
    </select>
    <h2 style="margin-top:14px">套餐</h2>
    <div id="v-plans">加载中…</div>
  </div>
  <div class="card"><h2>订单记录</h2><div id="v-orders" class="hint">暂无订单</div></div>
</div>

<div id="toast" class="pill hidden" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000"></div>

<script>
const BASE=location.origin;
let TOKEN=localStorage.getItem('qtoken')||'';
const insts=["BTC-USDT","ETH-USDT","SOL-USDT","BNB-USDT","XRP-USDT","DOGE-USDT","ADA-USDT","AVAX-USDT","LINK-USDT","TON-USDT",
  "BTC-USDT-SWAP","ETH-USDT-SWAP","SOL-USDT-SWAP","BNB-USDT-SWAP","XRP-USDT-SWAP","DOGE-USDT-SWAP"];

async function api(method,path,body){
  const opt={method,headers:{'Content-Type':'application/json'}};
  if(TOKEN)opt.headers['X-Auth-Token']=TOKEN;
  if(body)opt.body=JSON.stringify(body);
  const r=await fetch(BASE+path,opt);
  const j=await r.json();
  if(!r.ok||j.code!==0)throw new Error(j.msg||('HTTP '+r.status));
  return j.data;
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');
  setTimeout(()=>e.classList.add('hidden'),2500)}
function $(i){return document.getElementById(i)}
function fmt(n,d=2){if(n===null||n===undefined||isNaN(n))return'—';return Number(n).toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d})}

// 令牌门
async function boot(){
  $('srv').textContent='后端：'+BASE;
  try{const h=await api('GET','/api/health');$('srv').textContent='后端在线 · v'+h.version+' · Java '+h.javaVersion;}
  catch(e){$('srv').textContent='后端不可达：'+e.message;return}
  if(!TOKEN){$('gate').classList.remove('hidden');return}
  enter();
}
function saveToken(){TOKEN=$('tokIn').value.trim();localStorage.setItem('qtoken',TOKEN);enter()}
async function enter(){$('gate').classList.add('hidden');$('tabs').classList.remove('hidden');
  loadStrategies();refresh();setInterval(refresh,5000);}

// 选项卡
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['dash','cfg','log','vip'].forEach(t=>$('t-'+t).classList.add('hidden'));
  $('t-'+b.dataset.t).classList.remove('hidden');
  if(b.dataset.t==='cfg')loadConfig();
  if(b.dataset.t==='log')loadLogs();
  if(b.dataset.t==='vip')loadVip();
});

// 状态刷新
async function refresh(){
  try{
    const s=await api('GET','/api/status');
    const t=s.ticker||{};
    $('d-inst').textContent=s.instId;
    $('d-price').textContent=t.last||'—';
    const chg=t.changePct;
    $('d-chg').innerHTML=chg===undefined?'—':`<span class="${chg>=0?'up':'down'}">${chg>=0?'+':''}${fmt(chg)}%</span>`;
    $('d-hl').textContent=(t.high24h&&t.low24h)?fmt(+t.high24h)+' / '+fmt(+t.low24h):'—';
    $('d-run').innerHTML=s.running?'<span class="tag t-green">运行中</span>':'<span class="tag t-orange">已停止</span>';
    $('d-mode').innerHTML=s.demoTrading?'<span class="tag t-green">模拟盘</span>':'<span class="tag t-red">实盘</span>';
    $('d-tick').textContent=s.tickCount;
    $('d-bal').textContent=fmt(s.balanceUSDT);
    const sig=s.lastSignal;
    $('d-sig').textContent=sig?(sig.action+' · '+sig.reason):'尚未产生';
    $('d-ai').textContent=s.lastAIReply||'—';
    const err=$('d-err');if(s.errorMessage){err.textContent=s.errorMessage;err.classList.remove('hidden')}else err.classList.add('hidden');
    $('btnStart').disabled=s.running;$('btnStop').disabled=!s.running;
    // 持仓
    const pos=$('d-pos');
    if(!s.positions||s.positions.length===0)pos.innerHTML='<span class="k">空仓</span>';
    else pos.innerHTML=s.positions.map(p=>{
      const up=+p.upl>=0;const side=p.posSide==='long'||(p.posSide==='net'&&+p.pos>0);
      return `<div class="row"><span class="k">${side?'多头':'空头'} ${p.instId} ${p.lever}x 均价 ${fmt(+p.avgPx)}</span>
        <span class="v ${up?'up':'down'}">${up?'+':''}${fmt(+p.upl)} (${fmt(+p.uplRatio*100)}%)</span></div>`;
    }).join('');
    // 实盘警告
    $('liveWarn').classList.toggle('hidden',s.demoTrading);
  }catch(e){$('srv').textContent='刷新失败：'+e.message}
}

// 策略列表
async function loadStrategies(){
  try{const ss=await api('GET','/api/strategies');
    $('c-strat').innerHTML=ss.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');
    $('c-inst').innerHTML=insts.map(i=>`<option value="${i}">${i}</option>`).join('');
  }catch(e){}
}

// 配置加载
async function loadConfig(){
  try{
    const c=await api('GET','/api/config');
    $('c-mask').textContent=c.okxConfigured?(c.okxApiKeyMasked||'已配置'):'未配置';
    $('c-demo').value=c.demoTrading?'1':'0';
    $('c-strat').value=c.activeStrategy;
    $('c-inst').value=c.instId;
    $('c-bar').value=c.bar;
    $('c-size').value=c.tradeSizeUSDT;$('c-lev').value=c.leverage;$('c-poll').value=c.pollSeconds;
    $('c-maxt').value=c.maxTradesPerHour;$('c-sl').value=c.stopLossPct;$('c-tp').value=c.takeProfitPct;
    $('c-maxp').value=c.maxPositionUSDT;$('c-ai').value=c.aiEnabled?'1':'0';
  }catch(e){toast('加载配置失败：'+e.message)}
}
async function saveOKX(){
  const o={};if($('c-key').value)o.okxApiKey=$('c-key').value;
  if($('c-secret').value)o.okxApiSecret=$('c-secret').value;
  if($('c-pass').value)o.okxPassphrase=$('c-pass').value;
  o.demoTrading=$('c-demo').value==='1';
  try{await api('PUT','/api/config',o);toast('密钥已保存');$('c-key').value='';$('c-secret').value='';$('c-pass').value='';loadConfig();refresh();}
  catch(e){toast('保存失败：'+e.message)}
}
async function saveParams(){
  const o={activeStrategy:$('c-strat').value,instId:$('c-inst').value,bar:$('c-bar').value,
    tradeSizeUSDT:+$('c-size').value,leverage:+$('c-lev').value,pollSeconds:+$('c-poll').value,
    maxTradesPerHour:+$('c-maxt').value,stopLossPct:+$('c-sl').value,takeProfitPct:+$('c-tp').value,
    maxPositionUSDT:+$('c-maxp').value,aiEnabled:$('c-ai').value==='1'};
  try{await api('PUT','/api/config',o);toast('参数已保存');refresh();}
  catch(e){toast('保存失败：'+e.message)}
}
async function testOKX(){
  $('c-test').textContent='测试中…';
  try{const r=await api('POST','/api/config/test');
    $('c-test').innerHTML=r.ok?`<span class="ok">✅ ${r.message}${r.lastPrice?' · 现价 '+r.lastPrice:''}</span>`:`❌ ${r.message}`;}
  catch(e){$('c-test').innerHTML='❌ '+e.message}
}
async function engine(a){try{await api('POST','/api/engine/'+a);toast(a==='start'?'已启动':'已停止');refresh();}catch(e){toast(e.message)}}
async function closeAll(){if(!confirm('确认平掉全部持仓？'))return;try{const r=await api('POST','/api/trade/close-all');toast(r.message||'已平仓');refresh();}catch(e){toast(e.message)}}

// 日志
async function loadLogs(){
  try{const ls=await api('GET','/api/logs?limit=200');
    $('log-list').innerHTML=ls.map(l=>{
      const d=new Date(l.time);const ts=d.toTimeString().slice(0,8);
      const c=l.success?'t-green':'t-orange';
      return `<div><span class="a ${c}">${l.action}</span><span style="color:var(--muted)">${ts}</span> ${l.note}
        ${l.price>0?`<span style="color:var(--muted)"> · 价 ${fmt(l.price)} ${l.size>0?'量 '+fmt(l.size):''}</span>`:''}</div>`;
    }).join('')||'<span class="k">暂无日志</span>';
  }catch(e){$('log-list').textContent='加载失败：'+e.message}
}
async function clearLogs(){try{await api('DELETE','/api/logs');toast('已清空');loadLogs();}catch(e){toast(e.message)}}

// 会员
async function loadVip(){
  try{
    const s=await api('GET','/api/membership/status');
    $('v-status').innerHTML=
      '<div class="row"><span class="k">当前套餐</span><span class="v">'+s.planName+
      (s.active?'（生效中，剩 '+s.daysLeft+' 天）':'（未开通付费）')+'</span></div>'+
      '<div class="row"><span class="k">轮询下限</span><span class="v">'+s.benefits.minPollSeconds+' 秒</span></div>'+
      '<div class="row"><span class="k">AI 决策</span><span class="v">'+(s.benefits.aiEnabled?'已解锁':'未开通')+'</span></div>';
    const ps=await api('GET','/api/membership/plans');
    $('v-plans').innerHTML=ps.map(p=>
      '<div class="row"><span class="k">'+p.name+(p.badge?' · '+p.badge:'')+
      '<br><span style="font-size:11px;color:var(--muted)">'+p.features.join(' / ')+'</span></span>'+
      '<span class="v">'+(p.pricePerMonth===0?'免费':'¥'+p.pricePerMonth+'/月')+
      ' <button style="width:auto;padding:6px 12px;font-size:12px"'+
      ((p.id==='free'||p.id===s.level)?' disabled':'')+
      ' onclick="sub(\''+p.id+'\')">'+(p.id===s.level?'当前':'开通')+'</button></span></div>').join('');
    const os=await api('GET','/api/membership/orders');
    $('v-orders').innerHTML=os.length?os.map(o=>
      '<div class="row"><span class="k">'+o.planName+' · '+o.months+'个月 · '+
      String(o.createdAt).slice(0,16).replace('T',' ')+'</span><span class="v">¥'+o.total+'</span></div>').join('')
      :'暂无订单';
  }catch(e){$('v-status').textContent='加载失败：'+e.message}
}
async function sub(id){
  const m=+document.getElementById('v-months').value;
  try{
    const r=await api('POST','/api/membership/subscribe',{planId:id,months:m});
    toast('✅ 已开通 '+r.planName+'，至 '+String(r.expiresAt||'').slice(0,10));
    loadVip();
  }catch(e){toast('❌ '+e.message)}
}

boot();

</script>
</body>
</html>
