# Codemagic 备用构建通道（GitHub Actions macOS runner 受阻时使用）
# 用户操作：codemagic.io 用 GitHub 登录 → Add application 选 ios-todo-app →
# 选 workflow「amore-flutter-ios」→ Start first build（未签名 ipa 在 artifacts 下载）
workflows:
  amore-flutter-ios:
    name: Amore Flutter iOS (Rust Core)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.quantokx.amore
    scripts:
      - name: 安装 Rust + iOS 目标
        script: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target aarch64-apple-ios
          source "$HOME/.cargo/env"
          rustc --version && cargo --version

      - name: 生成 Flutter 脚手架
        script: |
          set -e
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter"
          flutter config --no-enable-swift-package-manager
          flutter create --org com.quantokx --project-name amore .
          flutter pub get

      - name: xcconfig 补丁（保 FFI 符号）
        script: |
          set -e
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter"
          for cfg in Debug Release; do
            printf '\nSTRIP_INSTALLED_PRODUCT=NO\nDEAD_CODE_STRIPPING=NO\n' >> "ios/Flutter/${cfg}.xcconfig"
          done

      - name: 编译 Rust Core（aarch64-apple-ios）
        script: |
          source "$HOME/.cargo/env"
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter"
          (cargo build --release --target aarch64-apple-ios --manifest-path native/amore_core/Cargo.toml 2>&1 || true) | tee rust-build.log
          (grep -E '^error(\[|:)' rust-build.log | head -40 || echo 'no errors captured') > rust-errors.txt
          echo '=== rust errors ==='; cat rust-errors.txt
          mkdir -p native/libs/ios
          cp native/amore_core/target/aarch64-apple-ios/release/libamore_core.a native/libs/ios/
          cp native/amore_core/include/amore_core.h native/libs/
          nm -gU native/libs/ios/libamore_core.a | grep -E 'amore_(call|free)'

      - name: Runner 工程注入链接设置（force_load + 禁 strip）
        script: |
          set -e
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter"
          ruby tools/fix_xcodeproj.rb
          # 玩偶 3D：把自定义 Swift（DollScene*）加入 Runner target
          ruby tools/add_native_files.rb

      - name: 真 3D 骨骼模型（CesiumMan GLB → USDZ 打进 bundle）
        script: |
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter/ios/Runner"
          mkdir -p Resources
          curl -sL --max-time 120 -o /tmp/CesiumMan.glb https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/CesiumMan/glTF-Binary/CesiumMan.glb
          echo "GLB size: $(wc -c < /tmp/CesiumMan.glb 2>/dev/null || echo 0)"
          if [ -s /tmp/CesiumMan.glb ]; then
            swift ../../tools/glb2usdz.swift /tmp/CesiumMan.glb Resources/CesiumMan.usdz 2>&1 | tail -5 || true
            ls -lh Resources/CesiumMan.usdz 2>/dev/null || echo "USDZ 转换失败 - 骨骼模型不可用（App 内回退程序化玩偶）"
          fi

      - name: pod install（同步 sandbox）
        script: |
          set -e
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter/ios"
          pod install

      - name: 编译 iOS（flutter 配置 + xcodebuild 未签名）
        script: |
          set -e
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter"
          flutter precache --ios
          # 只生成 Xcode 配置（Generated.xcconfig / pods 同步），不编译
          flutter build ios --config-only --release --no-codesign
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../xcodebuild.log | tail -40

      - name: 打包 ipa
        script: |
          set -e
          cd "${CM_REPO_DIR:-$HOME/clone}/amore-flutter"
          APP=build/Build/Products/Release-iphoneos/Runner.app
          test -f "$APP/Runner"
          nm "$APP/Runner" | grep -q _amore_call || { echo 'amore_call 未链入'; exit 1; }
          rm -rf Payload Amore.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Amore" Payload/Runner.app/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Amore" Payload/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 4.0.0" Payload/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER:-1}" Payload/Runner.app/Info.plist
          zip -qry Amore.ipa Payload
          echo "=== Amore.ipa ==="
          ls -lh Amore.ipa
          shasum -a 256 Amore.ipa
    artifacts:
      - amore-flutter/Amore.ipa
      - amore-flutter/*.log
      - amore-flutter/*.txt
      - amore-flutter/ios/*.log
