name: amore
description: "Amore — Flutter UI + Rust Core（iOS / macOS 双端统一运行时）"
publish_to: "none"
version: 4.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # dart:ffi 桥接 Rust Core 的辅助类型（Utf8 等）
  ffi: ^2.1.0
  # 状态管理
  provider: ^6.1.2
  # HTTP（聊天直连 / 服务端 / TTS）
  dio: ^5.4.3
  # 语音播放
  audioplayers: ^6.1.0
  # 沙盒目录
  path_provider: ^2.1.3
  # 日期格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
