server:
  port: 8090
  servlet:
    context-path: /api      # 端点即 http://host:8090/api/dolls ...

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/${DB_NAME:doll_studio}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USER:doll}
    password: ${DB_PASS:doll_pass}
    hikari:
      maximum-pool-size: 8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

dollstudio:
  token-secret: ${TOKEN_SECRET:change-me-in-env}   # 生产必须改（.env / 环境变量）
  uploads-dir: ${UPLOAD_DIR:./uploads}
  rate-limit-per-minute: 120

logging:
  level:
    com.quantokx.dollstudio: INFO
