name: DollStudio3D
options:
  bundleIdPrefix: com.quantokx
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
targets:
  DollStudio3D:
    type: application
    platform: iOS
    sources:
      - DollStudio
    info:
      path: DollStudio/Info.plist
      properties:
        CFBundleDisplayName: Doll Studio 3D
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: "保存穿搭截图到相册需要此权限。"
        NSMicrophoneUsageDescription: "仅当使用 AI 语音对话功能时需要麦克风（默认不启用）。"
        ITSAppUsesNonExemptEncryption: false
