name: Build QuantOKX iOS

on:
  workflow_dispatch:
  push:
    tags: ["quant-v*"]
    branches: [main]
    paths:
      - "quant-okx-ios/**"
      - ".github/workflows/quant-okx-ios.yml"

permissions:
  contents: write

jobs:
  build:
    name: 编译 QuantOKX ipa
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: quant-okx-ios
        run: xcodegen generate --spec project.yml

      - name: 编译（未签名）
        working-directory: quant-okx-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project QuantOKX.xcodeproj \
            -scheme QuantOKX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | tail -60

      - name: 打包 ipa
        working-directory: quant-okx-ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/QuantOKX.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到产物 $APP_PATH"
            exit 1
          fi
          rm -rf Payload QuantOKX.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/QuantOKX.app/_CodeSignature 2>/dev/null || true
          zip -qry QuantOKX.ipa Payload
          echo "=== 产物 ==="
          ls -lh QuantOKX.ipa
          echo "SHA256: $(shasum -a 256 QuantOKX.ipa | awk '{print $1}')"
          echo "架构: $(lipo -archs Payload/QuantOKX.app/QuantOKX)"
          echo "最低系统: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/QuantOKX.app/Info.plist)"
          echo "SDK: $(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' Payload/QuantOKX.app/Info.plist)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QuantOKX-ipa
          path: quant-okx-ios/QuantOKX.ipa
          retention-days: 30

      - name: 发 Release
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/quant-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/quant-v')
                && github.ref_name
                || format('quant-build-{0}', github.run_number) }}
          name: >-
            ${{ startsWith(github.ref, 'refs/tags/quant-v')
                && github.ref_name
                || format('QuantOKX 构建 #{0}', github.run_number) }}
          body: |
            QuantOKX iOS 控制端构建产物。
            后端仓库见同一仓库下的 `quant-okx-server/`。
            提交：`${{ github.sha }}`
          files: quant-okx-ios/QuantOKX.ipa
          draft: false
          prerelease: false

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quant-build-log
          path: quant-okx-ios/build.log
          retention-days: 7
