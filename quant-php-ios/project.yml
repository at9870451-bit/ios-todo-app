name: Amore
options:
  bundleIdPrefix: com.quantokx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Amore:
    type: application
    platform: iOS
    sources:
      - path: QuantOKX/Sources
    info:
      path: QuantOKX/Info.plist
      properties:
        CFBundleDisplayName: Amore
        CFBundleShortVersionString: "3.9"
        CFBundleVersion: "54"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 用于拍照并附带给 AI 助手识别
        NSPhotoLibraryAddUsageDescription: 用于保存玩偶穿搭照片到相册
        NSMicrophoneUsageDescription: 用于发送语音消息和与 AI 语音通话
        NSSpeechRecognitionUsageDescription: 用于将语音消息转成文字发给 AI
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantokx.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UIBackgroundModes: fetch
